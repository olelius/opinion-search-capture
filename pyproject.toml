[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "opinion-search-capture"
version = "0.1.0"
description = "多平台关键词搜索截图与字段化归档"
requires-python = ">=3.11"
dependencies = [
  "Pillow>=10.2,<12",
  "playwright>=1.48,<2",
  "uiautomator2>=3.7,<4",
  "APScheduler>=3.11,<4",
  "PySide6>=6.7,<7",
  "tzdata>=2024.1",
]

[project.scripts]
opinion-capture = "opinion_capture.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
